    <!-- SVG Filters for Glow Effects -->
    <svg class="svg-filters" style="position: absolute; width: 0; height: 0;">
        <defs>
            <filter id="glow">

                <feMerge>
                    <feMergeNode in="coloredBlur"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
            <filter id="neon-glow">
                <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
                <feMerge>
                    <feMergeNode in="coloredBlur"/>
                    <feMergeNode in="coloredBlur"/>
                    <feMergeNode in="SourceGraphic"/>

                    animation: imageFloat 4s ease-in-out infinite;
                ">
                    <!-- Decorative Sparkles Around Frame -->

                    <div style="position: absolute; bottom: -5px; right: 25%; font-size: 1.5rem; animation: sparkleRotate 3s linear infinite reverse;">✨</div>
                    
                    <!-- Inner Glow Ring -->
                    <div style="
                        position: absolute;
                        top: 10px;
                        left: 10px;
                        right: 10px;
                        bottom: 10px;
                        border-radius: 50%;
                        border: 3px solid rgba(255, 255, 255, 0.5);
                        box-shadow: 0 0 30px rgba(255, 182, 193, 0.6);

                        position: relative;
                        width: 100%;
                        height: 100%;

                        overflow: hidden;

                            height: 100%;

                            border-radius: 50%;

    <script>
        // Image Reveal Animation
        function revealImage() {
            const cover = document.getElementById('revealCover');
            if (cover) {
                // Magical reveal animation
                cover.style.transform = 'scale(0) rotate(180deg)';
                cover.style.opacity = '0';
                
                // Create sparkle burst effect
                const frame = cover.parentElement;
                const sparkles = ['✨', '💖', '💫', '🌟', '💕'];
                
                for (let i = 0; i < 12; i++) {
                    const sparkle = document.createElement('div');
                    sparkle.textContent = sparkles[Math.floor(Math.random() * sparkles.length)];
                    sparkle.style.position = 'absolute';
                    sparkle.style.fontSize = '1.5rem';
                    sparkle.style.left = '50%';
                    sparkle.style.top = '50%';
                    sparkle.style.pointerEvents = 'none';
                    sparkle.style.zIndex = '20';
                    
                    const angle = (Math.PI * 2 * i) / 12;
                    const distance = 100;
                    
                    frame.appendChild(sparkle);
                    
                    // Animate sparkle burst
                    setTimeout(() => {
                        sparkle.style.transition = 'all 1s ease-out';
                        sparkle.style.transform = `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px) scale(1.5) rotate(360deg)`;
                        sparkle.style.opacity = '0';
                        
                        setTimeout(() => sparkle.remove(), 1000);
                    }, 10);
                }
                
                // Remove cover after animation
                setTimeout(() => cover.remove(), 800);
            }
        }
    </script>
